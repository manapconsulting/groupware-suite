# Fail2ban configuration for mail server hardening
# Place this file at: /etc/fail2ban/jail.d/mail.conf

[DEFAULT]
# Ban for 24 hours (default was 1 hour)
bantime  = 86400
findtime = 600
maxretry = 3

# Email notifications (optional)
# destemail = admin@example.com
# sendername = Fail2ban
# mta = sendmail
# action = %(action_mwl)s

[postfix]
enabled  = true
port     = smtp,submission,smtps
filter   = postfix
logpath  = /var/log/mail.log
bantime  = 86400
maxretry = 3

[postfix-sasl]
enabled  = true
port     = smtp,submission,smtps,imap,imaps
filter   = postfix-sasl
logpath  = /var/log/mail.log
bantime  = 86400
maxretry = 3

[postfix-rbl]
enabled  = true
port     = smtp
filter   = postfix-rbl
logpath  = /var/log/mail.log
bantime  = 86400
maxretry = 1

[dovecot]
enabled  = true
port     = imap,imaps,pop3,pop3s,submission,smtps
filter   = dovecot
logpath  = /var/log/mail.log
bantime  = 86400
maxretry = 3

[sshd]
enabled  = true
port     = ssh
filter   = sshd
logpath  = /var/log/auth.log
bantime  = 86400
maxretry = 3
