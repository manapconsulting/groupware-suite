# Plugin configuration

plugin {
  # ACL (Access Control Lists) for shared mailboxes
  acl = vfile
  acl_shared_dict = file:/var/lib/dovecot/shared-mailboxes

  # Per-mailbox quota. The limit comes from virtual_users.quota via the
  # quota_rule returned by user_query (see dovecot-sql.conf.ext); a quota of 0
  # means unlimited.
  quota = maildir:User quota
  quota_grace = 10%%
}

# Enable ACL plugin for IMAP
protocol imap {
  mail_plugins = $mail_plugins acl imap_acl quota imap_quota
}

# LMTP rejects over-quota deliveries instead of accepting and losing them
protocol lmtp {
  mail_plugins = $mail_plugins quota
}
