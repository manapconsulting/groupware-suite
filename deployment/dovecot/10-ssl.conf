# SSL/TLS configuration

# SSL certificates (change to your domain)
ssl_cert = </etc/letsencrypt/live/CHANGE_ME_HOSTNAME/fullchain.pem
ssl_key = </etc/letsencrypt/live/CHANGE_ME_HOSTNAME/privkey.pem

ssl_client_ca_dir = /etc/ssl/certs

# SNI configuration for multiple domains (optional)
# Add entries like:
# local_name mail.yourdomain.com {
#   ssl_cert = </etc/letsencrypt/live/mail.yourdomain.com/fullchain.pem
#   ssl_key = </etc/letsencrypt/live/mail.yourdomain.com/privkey.pem
# }
