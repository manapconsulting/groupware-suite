# SSL/TLS configuration - Hardened

# SSL certificates
ssl_cert = </etc/letsencrypt/live/CHANGE_ME_HOSTNAME/fullchain.pem
ssl_key  = </etc/letsencrypt/live/CHANGE_ME_HOSTNAME/privkey.pem

ssl_client_ca_dir = /etc/ssl/certs

# Minimum TLS 1.2 - disable deprecated protocols
ssl_min_protocol = TLSv1.2

# Strong cipher suites (ECDHE preferred for forward secrecy)
ssl_cipher_list = ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384

# Prefer server cipher order over client
ssl_prefer_server_ciphers = yes

# DH parameters (generate with: openssl dhparam -out /etc/dovecot/dh.pem 4096)
ssl_dh = </etc/dovecot/dh.pem

