# Mail location and mailbox settings

# Location for users' mailboxes
mail_location = maildir:/var/mail/vhosts/%d/%n/Maildir

# System user/group to use for accessing mail
first_valid_uid = 1000

# Mail plugins to load
mail_plugins = acl quota

# Namespace configuration
namespace inbox {
  inbox = yes
  location =
  prefix =
  separator = /

  # Mailboxes that are created automatically
  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Junk {
    special_use = \Junk
  }
  mailbox Sent {
    special_use = \Sent
  }
  mailbox "Sent Messages" {
    special_use = \Sent
  }
  mailbox Trash {
    special_use = \Trash
  }
}

# Shared mailboxes namespace
namespace {
  type = shared
  separator = /
  prefix = shared/%%u/
  location = maildir:/var/mail/vhosts/%%d/%%n/Maildir:INDEX=~/Maildir/shared/%%u
  subscriptions = no
  list = yes
}
